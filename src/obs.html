<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>UnCam — вебка</title>
<style>
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
</style>
</head>
<body>
<canvas id="v" width="1280" height="720"></canvas>
<script src="player.js"></script>
<script>
const p = Player(document.getElementById("v"));
try { p.setView(JSON.parse(localStorage.getItem("ucView") || "{}")); } catch {}
window.uc.onV((ev) => p.feed(ev));
window.uc.onView((v) => p.setView(v));
window.uc.onExit(() => p.clear());
</script>
</body>
</html>
